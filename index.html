document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  // Error sink persists across replaceWith since it's on window, not the DOM.

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lor: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .inpu :var(--color-info);\">3<\u002Fdiv><div style=\"font-size:9.5px;color:var(--color-neutral-600);\">pedidos de apoio<\u002Fdiv><\u002Fdiv>\n            <div class=\"cm-card\"><div style=\"font-size:16px;font-weight:800;color:var(--color-accent-2-600);\">74%<\u002Fdiv><div style=\"font-size:9.5px;color:var(--color-neutral-600);\">colaboração entre grupos<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"cm-card\" style=\"display:flex;flex-direction:column;gap:8px;\">\n            <sc-for list=\"{{ trackingBars }}\" as=\"tb\" hint-placeholder-count=\"3\">\n              <div>\n                <div style=\"display:flex;justify-content:space-between;font-size:11px;color:var(--color-neutral-700);margin-bottom:4px;\"><span>{{ tb.label }}<\u002Fspan><span>{{ tb.pct }}%<\u002Fspan><\u002Fdiv>\n                <div style=\"width:100%;height:7px;border-radius:999px;background:var(--color-neutral-200);overflow:hidden;\"><div style=\"{{ tb.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div class=\"cm-card\" style=\"display:flex;flex-direction:column;gap:6px;\">\n            <div style=\"font-size:12px;font-weight:800;color:var(--color-neutral-900);\">Indicador de conexões da turma<\u002Fdiv>\n            <div style=\"font-size:11px;color:var(--color-neutral-700);\">78% da turma colaborou com pelo menos 3 colegas diferentes neste mês.<\u002Fdiv>\n            <div style=\"font-size:9.5px;color:var(--color-neutral-500);\">Indicador agregado para apoiar a mediação pedagógica. Não expõe alunos individualmente.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"cm-card\" style=\"display:flex;flex-direction:column;gap:8px;\">\n            <div style=\"font-size:12px;font-weight:800;color:var(--color-neutral-900);\">Pedidos de apoio<\u002Fdiv>\n            <div style=\"font-size:11px;color:var(--color-neutral-700);\">Grupo 3 sinalizou dúvida sobre o favo \"Dados\".<\u002Fdiv>\n ervem para classificar estudantes.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"cm-card\" style=\"display:flex;flex-direction:column;gap:8px;\">\n            <div style=\"font-size:12.5px;font-weight:800;color:var(--color-neutral-900);\">Próximos passos sugeridos<\u002Fdiv>\n            <div style=\"font-size:11px;color:var(--color-neutral-700);\">• Criar uma missão com papéis rotativos.<\u002Fdiv>\n            <div style=\"font-size:11px;color:var(--color-neutral-700);\">• Retomar um tema com grupos misturados.<\u002Fdiv>\n            <div style=\"font-size:11px;color:var(--color-neutral-700);\">• Abrir uma conversa coletiva sobre as descobertas.<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ mediatorSoon }}\" class=\"btn btn-secondary btn-block\">Baixar relatório<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ md.isComunidades }}\">\n        <div style=\"flex:1;overflow-y:auto;padding:18px 20px 14px;display:flex;flex-direction:column;gap:14px;\">\n          <div style=\"font-family:var(--font-heading);font-size:19px;color:var(--color-neutral-900);\">Comunidades<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--color-neutral-600);margin-top:-8px;\">Onde as experiências continuam.<\u002Fdiv>\n          <div style=\"display:flex;gap:6px;\">\n            <sc-for list=\"{{ mediatorComunidadeTabsList }}\" as=\"t\" hint-placeholder-count=\"3\">\n              <button class=\"cm-tab\" style=\"{{ t.style }}\" sc-camel-on-click=\"{{ t.onClick }}\">{{ t.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ md.tabComIsMinhas }}\">\n            <sc-if value=\"{{ cienciasExpanded }}\">\n              <div style=\"display:flex;flex-direction:column;gap:9px;\">\n                <button sc-camel-on-click=\"{{ collapseCiencias }}\" style=\"align-self:flex-start;background:transparent;border:none;cursor:pointer;color:var(--color-neutral-800);display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\"><path d=\"M15 6l-6 6 6 6\"><\u002Fpath><\u002Fsvg>Comunidades<\u002Fbutton>\n                <div style=\"font-family:var(--font-heading);font-size:16px;color:var(--color-neutral-900);\">Clube de Ciências<\u002Fdiv>\n                <sc-for list=\"{{ clubeFeed }}\" as=\"fi\" hint-placeholder-count=\"3\">\n                  <div class=\"cm-card\" style=\"display:flex;flex-direction:column;gap:5px;\">\n                    <div style=\"font-size:12px;color:var(--color-neutral-800);line-height:1.4;\">{{ fi.text }}<\u002Fdiv>\n                    <div style=\"font-size:10px;color:var(--color-neutral-500);\">{{ fi.time }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <button sc-camel-on-click=\"{{ mediatorSoon }}\" class=\"btn btn-secondary btn-block\">Moderar publicação<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ !cienciasExpanded }}\">\n              <div style=\"display:flex;flex-direction:column;gap:9px;\">\n                <sc-for list=\"{{ clubs }}\" as=\"cl\" hint-placeholder-count=\"3\">\n                  <div class=\"cm-card\" style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;\">\n                    <div><div style=\"font-size:12.5px;font-weight:800;color:var(--color-neutral-900);\">{{ cl.name }}<\u002Fdiv><div style=\"font-size:10px;color:var(--color-neutral-600);margin-top:2px;\">{{ cl.participants }} participantes · {{ cl.posts }} publicações<\u002Fdiv><\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ cl.onEnter }}\" class=\"btn btn-secondary\" style=\"padding:6px 12px;font-size:10.5px;flex-shrink:0;\">Entrar<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ md.tabComIsEmbaixadores }}\">\n            <div style=\"display:flex;flex-direction:column;gap:9px;\">\n              <sc-for list=\"{{ ambassadors }}\" as=\"am\" hint-placeholder-count=\"2\">\n                <div class=\"cm-card\" style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;\">\n                  <div style=\"display:flex;align-items:center;gap:10px;\"><div style=\"width:36px;height:36px;border-radius:50%;background:var(--color-teal);flex-shrink:0;\"><\u002Fdiv><div><div style=\"font-size:12px;font-weight:800;color:var(--color-neutral-900);\">{{ am.name }}<\u002Fdiv><div style=\"font-size:10px;color:var(--color-neutral-600);\">{{ am.role }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ mediatorSoon }}\" class=\"btn btn-secondary\" style=\"padding:6px 10px;font-size:10px;flex-shrink:0;\">Conectar<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ md.isTurmas }}\">\n        <div style=\"flex:1;overflow-y:auto;padding:18px 20px 14px;display:flex;flex-direction:column;gap:14px;\">\n          <div style=\"font-family:var(--font-heading);font-size:19px;color:var(--color-neutral-900);\">Turmas e alunos<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--color-neutral-600);margin-top:-8px;\">Acompanhe experiências por turma, sem comparações individuais.<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px;\">\n            <sc-for list=\"{{ turmasList }}\" as=\"tu\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ tu.onClick }}\" class=\"cm-card\" style=\"text-align:left;border:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;\">\n                <div><div style=\"font-size:13px;font-weight:800;color:var(--color-neutral-900);\">{{ tu.name }}<\u002Fdiv><div style=\"font-size:10.5px;color:var(--color-neutral-600);margin-top:2px;\">{{ tu.students }} estudantes · {{ tu.missions }}<\u002Fdiv><\u002Fdiv>\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-neutral-400)\" stroke-width=\"2.75\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ turmaDetail }}\">\n          <div class=\"cm-overlay\">\n            <div class=\"cm-sheet\" style=\"position:relative;left:auto;right:auto;bottom:auto;padding:20px 20px 22px;gap:10px;border-radius:20px;width:100%;\">\n              <div style=\"font-family:var(--font-heading);font-size:16px;color:var(--color-neutral-900);\">{{ turmaDetail.name }}<\u002Fdiv>\n              <div class=\"cm-card\" style=\"display:flex;justify-content:space-between;\"><span style=\"font-size:11.5px;color:var(--color-neutral-700);\">Participação da turma<\u002Fspan><strong style=\"font-size:11.5px;\">82%<\u002Fstrong><\u002Fdiv>\n              <div class=\"cm-card\" style=\"display:flex;justify-content:space-between;\"><span style=\"font-size:11.5px;color:var(--color-neutral-700);\">Conexões entre colegas<\u002Fspan><strong style=\"font-size:11.5px;\">78%<\u002Fstrong><\u002Fdiv>\n              <div class=\"cm-card\" style=\"display:flex;justify-content:space-between;\"><span style=\"font-size:11.5px;color:var(--color-neutral-700);\">Missões ativas<\u002Fspan><strong style=\"font-size:11.5px;\">{{ turmaDetail.missions }}<\u002Fstrong><\u002Fdiv>\n              <div style=\"font-size:10px;color:var(--color-neutral-500);line-height:1.4;\">A Colmeia não acompanha navegação, localização ou tempo de tela dos estudantes.<\u002Fdiv>\n              <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ goRelatorioFromTurma }}\">Ver relatório da turma<\u002Fbutton>\n              <button class=\"btn btn-ghost btn-block\" sc-camel-on-click=\"{{ closeTurmaDetail }}\">Fechar<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ md.isPublicado }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px;text-align:center;\">\n          <svg width=\"48\" height=\"48\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-500)\" stroke-width=\"2.5\"><path d=\"M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5z\"><\u002Fpath><\u002Fsvg>\n          <div style=\"font-family:var(--font-heading);font-size:20px;color:var(--color-neutral-900);\">Missão publicada!<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--color-neutral-600);\">A Colmeia já está pronta para receber novas descobertas.<\u002Fdiv>\n          <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ goAcompanhamentoFromPublish }}\">Acompanhar missão<\u002Fbutton>\n          <button class=\"btn btn-ghost btn-block\" sc-camel-on-click=\"{{ goMediatorMissoes }}\">Voltar para missões<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ md.showNav }}\">\n        <div style=\"flex-shrink:0;display:flex;justify-content:space-around;padding:8px 2px 12px;border-top:1px solid var(--color-neutral-200);background:var(--color-bg);\">\n          <sc-for list=\"{{ mediatorNav }}\" as=\"nv\" hint-placeholder-count=\"5\">\n            <button class=\"cm-navbtn\" style=\"{{ nv.color }}\" sc-camel-on-click=\"{{ nv.onClick }}\">\n              <sc-if value=\"{{ nv.isHome }}\"><svg class=\"cm-icon\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\"><path d=\"M4 11l8-7 8 7\"><\u002Fpath><path d=\"M6 10v9h12v-9\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n              <sc-if value=\"{{ nv.isTurmas }}\"><svg class=\"cm-icon\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\"><circle cx=\"9\" cy=\"8\" r=\"3\"><\u002Fcircle><path d=\"M3 19c0-3 2.5-5 6-5s6 2 6 5\"><\u002Fpath><circle cx=\"17\" cy=\"9\" r=\"2.3\"><\u002Fcircle><path d=\"M15 14c2.7 0 5 1.7 5 5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n              <sc-if value=\"{{ nv.isNotif }}\"><svg class=\"cm-icon\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\"><path d=\"M6 8a6 6 0 1 1 12 0c0 3 1 5 2 6H4c1-1 2-3 2-6\"><\u002Fpath><path d=\"M9.5 19a2.5 2.5 0 0 0 5 0\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n              <sc-if value=\"{{ nv.isMissoes }}\"><svg class=\"cm-icon\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\"><circle cx=\"12\" cy=\"12\" r=\"8\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"3.4\"><\u002Fcircle><\u002Fsvg><\u002Fsc-if>\n              <sc-if value=\"{{ nv.isComunidade }}\"><svg class=\"cm-icon\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\"><path d=\"M12 3l7 4v10l-7 4-7-4V7z\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n              {{ nv.label }}\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ supportModalOpen }}\">\n        <div class=\"cm-overlay\">\n          <div class=\"cm-card\" style=\"width:100%;display:flex;flex-direction:column;gap:10px;\">\n            <div style=\"font-family:var(--font-heading);font-size:15px;color:var(--color-neutral-900);\">Mensagem de apoio à turma<\u002Fdiv>\n            <textarea class=\"input\" rows=\"4\" value=\"{{ supportMsg }}\" sc-camel-on-change=\"{{ onSupportMsgChange }}\" style=\"resize:none;\"><\u002Ftextarea>\n            <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ sendSupport }}\">Enviar orientação<\u002Fbutton>\n            <button class=\"btn btn-ghost btn-block\" sc-camel-on-click=\"{{ closeSupportModal }}\">Cancelar<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ publishConfirmOpen }}\">\n        <div class=\"cm-overlay\">\n          <div class=\"cm-card\" style=\"width:100%;display:flex;flex-direction:column;gap:10px;text-align:center;\">\n            <div style=\"font-family:var(--font-heading);font-size:15px;color:var(--color-neutral-900);\">Publicar missão?<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:var(--color-neutral-600);\">A missão ficará disponível para a turma selecionada e poderá ser acompanhada pelo painel do mediador.<\u002Fdiv>\n            <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ publishNow }}\">Publicar agora<\u002Fbutton>\n            <button class=\"btn btn-ghost btn-block\" sc-camel-on-click=\"{{ closePublishConfirm }}\">Revisar<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ mediatorToast }}\">\n        <div class=\"cm-toast\">{{ mediatorToast }}<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ mediatorSoonOpen }}\">\n        <div class=\"cm-overlay\">\n          <div class=\"cm-card\" style=\"max-width:230px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:24px 18px;\">\n            <svg width=\"42\" height=\"42\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-neutral-500)\" stroke-width=\"2.5\"><path d=\"M12 3l7 4v10l-7 4-7-4V7z\"><\u002Fpath><rect x=\"9\" y=\"10\" width=\"6\" height=\"5\" rx=\"1\"><\u002Frect><path d=\"M10.5 10V8.5a1.5 1.5 0 0 1 3 0V10\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-family:var(--font-heading);font-size:15px;color:var(--color-neutral-900);\">Disponível em breve<\u002Fdiv>\n            <div style=\"font-size:11px;color:var(--color-neutral-600);\">Estamos preparando esta experiência para fortalecer ainda mais a sua Colmeia.<\u002Fdiv>\n            <button class=\"btn btn-primary\" style=\"padding:9px 22px;font-size:12px;\" sc-camel-on-click=\"{{ closeMediatorSoon }}\">Entendi<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst BNCC_ITEMS = [\n  { code: 'EF07CI08', area: 'Ciências da Natureza', componente: 'Ciências', ano: '7º ano', texto: 'Caracterizar os principais ecossistemas brasileiros quanto à paisagem, à quantidade de água, ao tipo de solo, à disponibilidade de luz solar, à temperatura etc.' },\n  { code: 'EF07GE06', area: 'Ciências Humanas', componente: 'Geografia', ano: '7º ano', texto: 'Discutir em que medida a produção, a circulação e o consumo de mercadorias provocam impactos ambientais, assim como influem na distribuição de riquezas.' },\n  { code: 'EF07MA23', area: 'Matemática', componente: 'Matemática', ano: '7º ano', texto: 'Planejar e realizar pesquisa envolvendo variável categórica e numérica e organizar dados por meio de tabela e gráfico de setores ou barras.' },\n  { code: 'EF69LP28', area: 'Linguagens', componente: 'Língua Portuguesa', ano: '6º ao 9º ano', texto: 'Observar os mecanismos de modalização adequados aos textos jurídicos, as modalidades deônticas, que se referem ao eixo da conduta.' },\n  { code: 'EF15AR24', area: 'Linguagens', componente: 'Arte', ano: '1º ao 5º ano', texto: 'Caracterizar e experimentar brinquedos, brincadeiras, jogos, danças, canções e histórias de diferentes matrizes estéticas e culturais.' }\n];\nconst FAVO_ORDER = [\n  { name: 'Bebedouro', kind: 'cup', instruction: 'Converse com duas pessoas que usam este espaço em horários diferentes.', example: 'Percebemos que o bebedouro recebe mais estudantes no intervalo.', content: 'O bebedouro é um dos espaços com maior circulação de estudantes durante o intervalo.', question: 'Como o uso da água neste espaço pode ser mais consciente?', hint: 'Observe em quais momentos há mais pessoas no bebedouro e reflita sobre como isso influencia o consumo de água.', simpler: 'Quando muitas pessoas usam o bebedouro ao mesmo tempo, é importante evitar desperdício e fechar bem as torneiras.' },\n  { name: 'Torneiras', kind: 'droplet', instruction: 'Observe se alguma torneira vaza e pergunte à equipe de limpeza como isso é resolvido.', example: 'Uma torneira do 2º andar pinga o dia inteiro.', content: 'Uma torneira pingando pode desperdiçar milhares de litros de água por mês.', question: 'O que pode ser feito quando uma torneira apresenta vazamento?', hint: 'Observe se alguma torneira vaza e pergunte à equipe de limpeza como isso é resolvido.', simpler: 'Avisar a equipe da escola sobre uma torneira que vaza ajuda a evitar desperdício de água.' },\n  { name: 'Horta', kind: 'sprout', instruction: 'Visite a horta e descubra de onde vem a água usada para regá-la.', example: 'A horta usa água reaproveitada da chuva.', content: 'A horta escolar pode reaproveitar água da chuva para reduzir o consumo tratado.', question: 'De onde pode vir a água usada para regar a horta?', hint: 'Visite a horta e descubra de onde vem a água usada para regá-la.', simpler: 'Guardar água da chuva para regar plantas é uma forma simples de economizar.' },\n  { name: 'Banheiros', kind: 'bath', instruction: 'Verifique a pressão da água nos banheiros em horários diferentes do dia.', example: 'A pressão cai bastante no horário do almoço.', content: 'A pressão da água nos banheiros pode variar bastante ao longo do dia.', question: 'Por que a pressão da água muda em horários diferentes?', hint: 'Verifique a pressão da água nos banheiros em horários diferentes do dia.', simpler: 'Quando muita gente usa a água ao mesmo tempo, a pressão pode cair um pouco.' },\n  { name: 'Cozinha', kind: 'utensils', instruction: 'Converse com a equipe da
