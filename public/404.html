<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Colmeia</title>
    <!--
      SPA fallback para GitHub Pages (project page): GH Pages não sabe que
      /app-colmeia/app é uma rota do React Router, então serve este 404.html.
      Ele reescreve o caminho como query string e redireciona pra raiz do site;
      o script equivalente em index.html desfaz isso antes do React montar.
      Técnica: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // mantém "/app-colmeia" (nome do repositório)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
